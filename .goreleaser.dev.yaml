# Dev builds (pushes to the "dev" branch), used only by .github/workflows/dev.yaml.
#
# Always run with --snapshot: GoReleaser then publishes nothing (no GitHub
# Release, no tags, no registry push) and builds one local image per platform,
# tagged dev-<shortsha>-amd64 and dev-<shortsha>-arm64. The workflow pushes
# those and assembles the :dev and :dev-<shortsha> manifests itself, so
# :latest and the version tags of .goreleaser.yaml can never be touched.
#
# Keep "builds" in sync with .goreleaser.yaml.
version: 2
project_name: immich-optimizer

builds:
- main: ./cmd/optimizer
  env:
  - CGO_ENABLED=0
  goos:
  - linux
  goarch:
  - amd64
  - arm64

# -version reports e.g. "immich-optimizer dev-1a2b3c4, commit ..., built at ...".
snapshot:
  version_template: "dev-{{ .ShortCommit }}"

dockers_v2:
- images:
  - "ghcr.io/{{ .Env.IMAGE_OWNER }}/{{ .ProjectName }}"
  tags:
  - "dev-{{ .ShortCommit }}"
  dockerfile: Dockerfile.goreleaser
  platforms:
  - linux/amd64
  - linux/arm64
  sbom: false
  extra_files:
  - config
  - docker
  - LICENSE
  labels:
    org.opencontainers.image.created: "{{ .Date }}"
    org.opencontainers.image.title: "{{ .ProjectName }}"
    org.opencontainers.image.revision: "{{ .FullCommit }}"
    org.opencontainers.image.version: "{{ .Version }}"
    org.opencontainers.image.url: "https://github.com/miguelangel-nubla/{{ .ProjectName }}"
    org.opencontainers.image.source: "https://github.com/miguelangel-nubla/{{ .ProjectName }}"

archives:
- files:
  - LICENSE*
  - README*
  formats: tar.gz
  name_template: >-
    {{ .ProjectName }}_ {{- title .Os }}_ {{- if eq .Arch "amd64" }}x86_64 {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: 'checksums.txt'

# Belt and braces: even without --snapshot this config never creates a
# GitHub Release or a changelog.
release:
  disable: true
changelog:
  disable: true

