name: Dev

# Unstable builds of the "dev" branch: pushes ghcr.io/<owner>/immich-optimizer
# :dev and :dev-<shortsha> (amd64 + arm64) and uploads the binaries as a
# workflow artifact. It never creates a GitHub Release and never touches
# :latest or the semver tags (see .goreleaser.dev.yaml).
on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

# Runs for dev are serialised instead of cancelled, so a publish is never cut
# off between pushing images and moving :dev; GitHub keeps only the newest
# pending run, so :dev still ends on the latest commit.
concurrency:
  group: dev-publish
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'

      - name: Quality checks
        run: |
          go mod verify
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -race ./...

  publish:
    needs: test
    # A manual run from another branch must not move :dev.
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image owner (GHCR needs lowercase)
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      # --snapshot: GoReleaser builds binaries, archives and per-arch images
      # locally and publishes nothing. No GITHUB_TOKEN is passed on purpose.
      - name: Build dev snapshot
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.3
          args: release --snapshot --clean --config .goreleaser.dev.yaml

      - name: Push images and dev manifests
        run: |
          set -euo pipefail
          version="$(jq -r .version dist/metadata.json)"
          case "$version" in
            dev-*) ;;
            *) echo "::error::unexpected snapshot version '$version'"; exit 1 ;;
          esac
          repo="ghcr.io/${IMAGE_OWNER}/immich-optimizer"
          images=("$repo:$version-amd64" "$repo:$version-arm64")
          for img in "${images[@]}"; do
            docker image inspect "$img" >/dev/null || { echo "::error::$img was not built"; exit 1; }
            docker push "$img"
          done
          # The registry does not always show an image the moment its push
          # returns: try a few times before giving up.
          for attempt in 1 2 3 4 5; do
            if docker buildx imagetools create \
              --tag "$repo:$version" \
              --tag "$repo:dev" \
              "${images[@]}"; then
              break
            fi
            [ "$attempt" -lt 5 ] || { echo "::error::could not create the dev manifests"; exit 1; }
            sleep $((attempt * 10))
          done
          {
            echo "### Dev images"
            echo
            echo "- \`$repo:dev\`"
            echo "- \`$repo:$version\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: immich-optimizer-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 30
