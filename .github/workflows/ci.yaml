name: CI

# Checks only: nothing is published and no registry is logged into.
on:
  pull_request:
  push:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Verify modules
        run: go mod verify

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: |
          go vet ./...
          GOOS=linux go vet ./...
          GOOS=darwin go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Check GoReleaser configs
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check .goreleaser.yaml .goreleaser.dev.yaml
        env:
          IMAGE_OWNER: ci

      - name: Build snapshot binaries
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --snapshot --clean

  # Runs the bundled profiles' real commands (cjxl, caesiumclt, vips, magick,
  # HandBrakeCLI, exiftool) on sample files inside the image built from this
  # commit: JPEG, PNG, HEIC, Apple Live Photos, motion photos and video.
  # The GPU video task is skipped: runners have no /dev/dri.
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Vet integration tests
        run: go vet -tags integration ./cmd/optimizer

      - name: Build image
        run: scripts/build-image.sh immich-optimizer:ci

      - name: Integration tests
        run: scripts/integration-test.sh immich-optimizer:ci

  # Builds Dockerfile.custom (the Alpine-based template for GPU images) and
  # runs the same profile tests in it, so the template cannot rot unnoticed.
  # Its optimizer binary is the latest release; the tests use this commit's
  # profiles and test code.
  custom-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Build custom image
        run: docker build -f Dockerfile.custom -t immich-optimizer:custom-ci .

      - name: Integration tests
        run: scripts/integration-test.sh immich-optimizer:custom-ci

  # End-to-end: a real Immich (Docker Compose) with the optimizer image built
  # from this commit, in library, proxy and watcher mode.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Vet end-to-end tests
        run: go vet -tags e2e ./e2e/

      - name: Build image
        run: scripts/build-image.sh immich-optimizer:ci

      - name: End-to-end tests
        # With Immich's machine learning, so the face-recognition test runs too.
        run: E2E_ML=1 scripts/e2e-test.sh immich-optimizer:ci -v

  # The real Immich Android app in an emulator, backing up through the proxy.
  e2e-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the emulator and a system image
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "emulator" "platform-tools" "system-images;android-36;google_apis;x86_64" >/dev/null

      - name: Build image
        run: scripts/build-image.sh immich-optimizer:ci

      - name: Android app tests
        run: E2E_ANDROID=1 scripts/e2e-test.sh immich-optimizer:ci -v -run TestAndroid

      - name: Emulator log
        if: failure()
        run: tail -n 100 "${TMPDIR:-/tmp}/io-android/emulator.log" || true
