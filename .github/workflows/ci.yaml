name: CI

# Checks only: nothing is published and no registry is logged into.
# release.yaml calls this workflow too, so a tag is published only after the
# same checks pass on the tagged commit.
on:
  pull_request:
  push:
    branches:
      - '**'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'

      - name: Verify modules
        run: go mod verify

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: |
          go vet ./...
          GOOS=linux go vet ./...
          GOOS=darwin go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      # The shell scripts and the workflows themselves. shellcheck comes with
      # the runner.
      - name: Lint scripts and workflows
        run: |
          shellcheck -S warning scripts/*.sh docker/*.sh
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes=

      # Known vulnerabilities in the Go version and the modules, in code the
      # optimizer actually calls. Most fixes are a newer Go patch release in
      # go.mod.
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'

      - name: Check GoReleaser configs
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.3
          args: check .goreleaser.yaml .goreleaser.dev.yaml
        env:
          IMAGE_OWNER: ci

      - name: Build snapshot binaries
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.3
          args: build --snapshot --clean

  # Runs the bundled profiles' real commands (cjxl, caesiumclt, vips, magick,
  # HandBrakeCLI, exiftool) on sample files inside the image built from this
  # commit: JPEG, PNG, HEIC, Apple Live Photos, motion photos and video.
  # The GPU video task is skipped: runners have no /dev/dri.
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'

      - name: Vet integration tests
        run: go vet -tags integration ./cmd/optimizer

      - name: Build image
        run: scripts/build-image.sh immich-optimizer:ci

      - name: Integration tests
        run: scripts/integration-test.sh immich-optimizer:ci
        env:
          IO_TEST_CPUS: "4"
          IO_TEST_MEMORY: "12g"

  # End-to-end: a real Immich (Docker Compose) with the optimizer image built
  # from this commit, in library, proxy and watcher mode.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'

      - name: Vet end-to-end tests
        run: go vet -tags e2e ./e2e/

      - name: Build image
        run: scripts/build-image.sh immich-optimizer:ci

      # The video test transcodes real phone clips for several minutes. It
      # runs when what it tests has changed (the profiles, the image, the
      # test itself), and always on main, so a change whose own run was
      # cancelled by a later push is still tested before a release. For a
      # release tag (called from release.yaml) the change is the one since the
      # newest other release tag.
      - name: Is the video test needed?
        id: video
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/*)
              # The checkout is shallow: take the newest other v* tag by
              # version, without walking history, and fetch just that commit.
              BASE="$(git ls-remote -q --tags --refs origin 'v*' | sed 's#.*refs/tags/##' \
                | grep -vxF "${GITHUB_REF#refs/tags/}" | sort -rV | head -n1 || true)"
              if [ -n "$BASE" ]; then
                git fetch -q --depth=1 origin "refs/tags/$BASE:refs/tags/$BASE" 2>/dev/null || BASE=
              fi
              ;;
          esac
          run=1
          if [ "$GITHUB_REF" != refs/heads/main ] && [ -n "$BASE" ] && git fetch -q --depth=1 origin "$BASE" 2>/dev/null; then
            if ! git diff --name-only "$BASE" HEAD | grep -qE '^(config/|Dockerfile|docker/|scripts/build-image\.sh|e2e/video_test\.go)'; then
              run=
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "video test: ${run:-skipped}"

      - name: End-to-end tests
        # With Immich's machine learning, so the face-recognition test runs too.
        run: E2E_ML=1 E2E_VIDEO=${{ steps.video.outputs.run }} scripts/e2e-test.sh immich-optimizer:ci -v

  # The real Immich Android app in an emulator, backing up through the proxy.
  e2e-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: 'go.mod'

      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the emulator and a system image
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "emulator" "platform-tools" "system-images;android-36;google_apis;x86_64" >/dev/null

      - name: Build image
        run: scripts/build-image.sh immich-optimizer:ci

      - name: Android app tests
        run: E2E_ANDROID=1 scripts/e2e-test.sh immich-optimizer:ci -v -run TestAndroid

      - name: Emulator log
        if: failure()
        run: tail -n 100 "${TMPDIR:-/tmp}/io-android/emulator.log" || true
