version: 2
before:
  hooks:
  - go generate ./...
  - go mod tidy
builds:
- main: ./cmd/optimizer
  env:
  - CGO_ENABLED=0
  goos:
  - linux
  goarch:
  - amd64
  - arm64
# One multi-platform image per release, built and pushed in one step.
# A pre-release tag (-beta, -rc) only publishes its own tag: "latest" and the
# series tags move on stable releases only (empty tags are ignored).
dockers_v2:
- images:
  - "ghcr.io/miguelangel-nubla/{{ .ProjectName }}"
  tags:
  - "{{ .Tag }}"
  - "{{ if not .Prerelease }}latest{{ end }}"
  - "{{ if not .Prerelease }}v{{ .Major }}{{ end }}"
  - "{{ if not .Prerelease }}v{{ .Major }}.{{ .Minor }}{{ end }}"
  dockerfile: Dockerfile.goreleaser
  platforms:
  - linux/amd64
  - linux/arm64
  extra_files:
  - config
  - docker
  - LICENSE
  labels:
    org.opencontainers.image.created: "{{ .Date }}"
    org.opencontainers.image.title: "{{ .ProjectName }}"
    org.opencontainers.image.revision: "{{ .FullCommit }}"
    org.opencontainers.image.version: "{{ .Version }}"
    org.opencontainers.image.url: "https://github.com/miguelangel-nubla/{{ .ProjectName }}"
    org.opencontainers.image.source: "https://github.com/miguelangel-nubla/{{ .ProjectName }}"
archives:

- files:
  - LICENSE*
  - README*
  - CHANGELOG*
  formats: tar.gz
  name_template: >-
    {{ .ProjectName }}_ {{- title .Os }}_ {{- if eq .Arch "amd64" }}x86_64 {{- else if eq .Arch "386" }}i386 {{- else }}{{ .Arch }}{{ end }} {{- if .Arm }}v{{ .Arm }}{{ end }}
  format_overrides:
  - goos: windows
    formats: zip

release:
  # -beta / -rc tags become GitHub pre-releases instead of "Latest".
  prerelease: auto

checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
    - '^docs:'
    - '^test:'

