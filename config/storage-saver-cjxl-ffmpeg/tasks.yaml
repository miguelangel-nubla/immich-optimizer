tasks:
  - name: jpeg-xl
    command: cjxl --lossless_jpeg=0 -q 80 --container=1 --compress_boxes=0 {{.src_folder}}/{{.name}}.{{.extension}} {{.dst_folder}}/{{.name}}-new.jxl 
    extensions:
      - jpeg
      - jpg
      - png
      - pgx
      - pam
      - pnm
      - pgm
      - ppm
      - pfm
      - gif
      - exr

  - name: caesium
    command: caesiumclt --keep-dates --exif --quality=0 --output={{.src_folder}} {{.dst_folder}}/{{.name}}.{{.extension}}
    extensions:
      - jpeg
      - jpg
      - png
      - tiff
      - tif
      - webp
      - gif
  - name: videos-ffmpeg-nvenc
    command: >
      ffmpeg
      -i "{{.src_folder}}/{{.name}}.{{.extension}}"
      -map 0:v
      -map 0:a?
      -map 0:s?
      -map_metadata 0
      -movflags use_metadata_tags
      -c:v av1_nvenc
      -preset p7
      -tune hq
      -rc vbr
      -cq 35
      -multipass fullres
      -spatial-aq 1
      -temporal-aq 1
      -c:a libopus
      -b:a 96k
      "{{.dst_folder}}/{{.name}}-new.mp4"
      &&
       exiftool -overwrite_original -TagsFromFile "{{.src_folder}}/{{.name}}.{{.extension}}"  -Model -Make -HandlerDescription "{{.dst_folder}}/{{.name}}-new.mp4"
    extensions:
      - 3gp
      - 3gpp
      - avi
      - av1
      - flv
      - hevc
      - insv
      - m2t
      - m2ts
      - m4v
      - mkv
      - mod
      - mov
      - mpe
      - mpg
      - mp4
      - mts
      - tod
      - ts
      - webm
      - wmv