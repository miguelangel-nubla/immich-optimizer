# What a task receives when the file is a motion photo (a photo with a short
# embedded video): keep (as it is), drop_video (only the photo) or drop_photo
# (only the video). This is the default for every task below; a task can set
# its own "motion_photos:" to override it.
motion_photos: drop_video

tasks:
- name: jpeg-xl
  command: cjxl --lossless_jpeg=1 -d 0 "{{.src_folder}}/{{.name}}.{{.extension}}" "{{.dst_folder}}/{{.name}}.jxl"
  extensions:
  - jpeg
  - jpg
  - png
  - pgx
  - pam
  - pnm
  - pgm
  - ppm
  - pfm
  - gif
  - exr

- name: caesium
  command: caesiumclt --keep-dates --exif --lossless --output="{{.dst_folder}}" "{{.src_folder}}/{{.name}}.{{.extension}}"
  extensions:
  - jpeg
  - jpg
  - png
  - tiff
  - tif
  - webp
  - gif

# Note not all image formats accepted by immich are supported by jpeg-xl and caesium so passthrough the rest as-is.
# https://immich.app/docs/features/supported-formats/
- name: passthrough-images
  command: ""
  extensions:
  - avif
  - bmp
  - heic
  - heif
  - insp
  - jxl
  - psd
  - raw
  - rw2
  - svg

# Not aware of any lossless video conversion that will result in a smaller file size than the original so keep them as-is.
# Check out config folder for lossy video conversion examples.
- name: passthrough-videos
  command: ""
  extensions:
  - 3gp
  - 3gpp
  - avi
  - flv
  - m4v
  - mkv
  - mts
  - m2ts
  - m2t
  - mp4
  - insv
  - mpg
  - mpe
  - mpeg
  - mov
  - webm
  - wmv

# Every other image format Immich accepts (including camera RAW) is uploaded as it is.
- name: passthrough-other-images
  command: ""
  extensions:
  - jfif
  - hif
  - jp2
  - jpe
  - mpo
  - 3fr
  - ari
  - arw
  - cap
  - cin
  - cr2
  - cr3
  - crw
  - dcr
  - dng
  - erf
  - fff
  - iiq
  - k25
  - kdc
  - mrw
  - nef
  - nrw
  - orf
  - ori
  - pef
  - raf
  - rwl
  - sr2
  - srf
  - srw
  - x3f

# Every other video format Immich accepts is uploaded as it is.
- name: passthrough-other-videos
  command: ""
  extensions:
  - mxf
  - ts
  - vob
