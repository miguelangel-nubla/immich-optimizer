# What a task receives when the file is a motion photo (a photo with a short
# embedded video): keep (as it is), drop_video (only the photo) or drop_photo
# (only the video). This is the default for every task below; a task can set
# its own "motion_photos:" to override it.
motion_photos: drop_video

# Proxy mode: hand an original out in another format when it is downloaded.
# What is stored as JPEG XL is downloaded as JPEG, which everything opens.
# Remove this list to download files as they are stored. See docs/tasks.md,
# "Downloads".
downloads:
- name: jxl-to-jpeg
  command: |
    djxl \
      "{{.src_folder}}/{{.name}}.{{.extension}}" \
      "{{.dst_folder}}/{{.name}}.jpg"
  extensions:
  - jxl

tasks:
- name: jpeg-xl
  command: |
    cjxl --lossless_jpeg=0 -q 75 \
      "{{.src_folder}}/{{.name}}.{{.extension}}" \
      "{{.dst_folder}}/{{.name}}.jxl"
  extensions:
  - jpeg
  - jpg
  - png
  - pgx
  - pam
  - pnm
  - pgm
  - ppm
  - pfm
  - gif
  - exr

# cjxl does not read HEIC: vips converts the photo, and the EXIF is copied
# over. A motion photo arrives here already without its video (see
# motion_photos above). vips carries the XMP over, so the motion flags are
# removed in case the photo came with its video ("keep"): the output must not
# claim a video it does not have.
- name: heic2jxl
  command: |
    vips copy \
      "{{.src_folder}}/{{.name}}.{{.extension}}" \
      "{{.dst_folder}}/{{.name}}.jxl[Q=75]" \
    && exiftool -m -overwrite_original \
      -tagsfromfile "{{.src_folder}}/{{.name}}.{{.extension}}" -exif \
      -XMP-GCamera:MotionPhoto= -XMP-GCamera:MotionPhotoVersion= \
      -XMP-GCamera:MotionPhotoPresentationTimestampUs= \
      "{{.dst_folder}}/{{.name}}.jxl"
  extensions:
  - heic
  - heif

- name: caesium
  command: |
    caesiumclt --keep-dates --exif --quality=85 \
      --output="{{.dst_folder}}" \
      "{{.src_folder}}/{{.name}}.{{.extension}}"
  extensions:
  - jpeg
  - jpg
  - png
  - webp
  - gif

- name: handbrake
  command: |
    HandBrakeCLI --preset-import-file handbrake.json -Z immich-optimizer \
      -i "{{.src_folder}}/{{.name}}.{{.extension}}" \
      -o "{{.dst_folder}}/{{.name}}.mp4" \
    && exiftool -overwrite_original \
      -tagsfromfile "{{.src_folder}}/{{.name}}.{{.extension}}" \
      -all:all -m -FileModifyDate "{{.dst_folder}}/{{.name}}.mp4"
  extensions:
  - 3gp
  - 3gpp
  - avi
  - flv
  - m4v
  - mkv
  - mts
  - m2ts
  - m2t
  - mp4
  - insv
  - mpg
  - mpe
  - mpeg
  - mov
  - webm
  - wmv

# Every other image format Immich accepts is uploaded as it is. That includes
# camera RAW, DNG too: the tools in the image do not develop RAW files. They
# read the small preview stored inside one, and would replace the photo with it.
- name: passthrough-other-images
  command: ""
  extensions:
  - avif
  - bmp
  - jfif
  - hif
  - insp
  - jp2
  - jpe
  - jxl
  - mpo
  - svg
  # caesiumclt 1.5 does not take TIFF ("Unable to compute the base path
  # for the files"), and nothing else in the image keeps every page of one.
  - tif
  - tiff
  - 3fr
  - ari
  - arw
  - cap
  - cin
  - cr2
  - cr3
  - crw
  - dcr
  - dng
  - erf
  - fff
  - iiq
  - k25
  - kdc
  - mrw
  - nef
  - nrw
  - orf
  - ori
  - pef
  - psd
  - raf
  - raw
  - rw2
  - rwl
  - sr2
  - srf
  - srw
  - x3f

# Every other video format Immich accepts is uploaded as it is.
- name: passthrough-other-videos
  command: ""
  extensions:
  - mxf
  - ts
  - vob
