# What a task receives when the file is a motion photo (a photo with a short
# embedded video): keep (as it is), drop_video (only the photo) or drop_photo
# (only the video). This is the default for every task below; a task can set
# its own "motion_photos:" to override it.
motion_photos: drop_video

tasks:
- name: jpeg-xl
  command: cjxl --lossless_jpeg=0 -q 75 "{{.src_folder}}/{{.name}}.{{.extension}}" "{{.dst_folder}}/{{.name}}.jxl"
  extensions:
  - jpeg
  - jpg
  - png
  - pgx
  - pam
  - pnm
  - pgm
  - ppm
  - pfm
  - gif
  - exr

- name: heic2jxl
  command: ./heic2jxl.sh "{{.src_folder}}" "{{.name}}" "{{.extension}}" "{{.dst_folder}}"
  extensions:
  - heic
  - heif

- name: caesium
  command: caesiumclt --keep-dates --exif --quality=85 --output="{{.dst_folder}}" "{{.src_folder}}/{{.name}}.{{.extension}}"
  extensions:
  - jpeg
  - jpg
  - png
  - tiff
  - tif
  - webp
  - gif

- name: vips
  command: vips copy "{{.src_folder}}/{{.name}}.{{.extension}}" "{{.dst_folder}}/{{.name}}.jxl[Q=75]"
  extensions:
  - dng

- name: handbrake
  command: >
    HandBrakeCLI --preset-import-file handbrake.json -Z immich-optimizer \
      -i "{{.src_folder}}/{{.name}}.{{.extension}}" \
      -o "{{.dst_folder}}/{{.name}}.mp4" \
    && exiftool -overwrite_original \
      -tagsfromfile "{{.src_folder}}/{{.name}}.{{.extension}}" \
      -all:all -m -FileModifyDate "{{.dst_folder}}/{{.name}}.mp4"
  extensions:
  - 3gp
  - 3gpp
  - avi
  - flv
  - m4v
  - mkv
  - mts
  - m2ts
  - m2t
  - mp4
  - insv
  - mpg
  - mpe
  - mpeg
  - mov
  - webm
  - wmv

# Block all other formats from being uploaded.

# Every other image format Immich accepts (including camera RAW) is uploaded as it is.
- name: passthrough-other-images
  command: ""
  extensions:
  - avif
  - bmp
  - jfif
  - hif
  - insp
  - jp2
  - jpe
  - jxl
  - mpo
  - svg
  - 3fr
  - ari
  - arw
  - cap
  - cin
  - cr2
  - cr3
  - crw
  - dcr
  - erf
  - fff
  - iiq
  - k25
  - kdc
  - mrw
  - nef
  - nrw
  - orf
  - ori
  - pef
  - psd
  - raf
  - raw
  - rw2
  - rwl
  - sr2
  - srf
  - srw
  - x3f

# Every other video format Immich accepts is uploaded as it is.
- name: passthrough-other-videos
  command: ""
  extensions:
  - mxf
  - ts
  - vob
