# What a task receives when the file is a motion photo (a photo with a short
# embedded video): keep (as it is), drop_video (only the photo) or drop_photo
# (only the video). This is the default for every task below; a task can set
# its own "motion_photos:" to override it.
motion_photos: drop_video

# Proxy mode: hand an original out in another format when it is downloaded.
# What is stored as JPEG XL is downloaded as JPEG, which everything opens.
# Remove this list to download files as they are stored. See docs/tasks.md,
# "Downloads".
downloads:
- name: jxl-to-jpeg
  command: djxl "{{.src_folder}}/{{.name}}.{{.extension}}" "{{.dst_folder}}/{{.name}}.jpg"
  extensions:
  - jxl

tasks:
  # Images: Resize to max 16MP, encode to JXL, restore metadata
  - name: images-magick-jxl
    command: >
      magick "{{.src_folder}}/{{.name}}.{{.extension}}"
      -auto-orient
      -resize 4096x4096\>
      ppm:- |
      cjxl - "{{.dst_folder}}/{{.name}}-new.jxl"
      -q 80
      --effort=7
      && exiftool -overwrite_original
      -tagsfromfile "{{.src_folder}}/{{.name}}.{{.extension}}"
      -all:all -m -Orientation=1
      -XMP-GCamera:MotionPhoto= -XMP-GCamera:MotionPhotoVersion=
      -XMP-GCamera:MotionPhotoPresentationTimestampUs=
      "{{.dst_folder}}/{{.name}}-new.jxl"
    extensions:
      - avif
      - bmp
      - gif
      - heic
      - heif
      - jpeg
      - jpg
      - png
      - tiff
      - tif
      - webp

  # Videos: ffmpeg with hwaccel from AMD iGPU.
  - name: videos-ffmpeg
    command: >
      ffmpeg
      -hwaccel vaapi
      -hwaccel_device /dev/dri/renderD128
      -i "{{.src_folder}}/{{.name}}.{{.extension}}"
      -vf "scale='if(gt(iw,ih),min(1920,iw),-2)':'if(gt(ih,iw),min(1920,ih),-2)':flags=lanczos,format=p010,hwupload"
      -c:v hevc_vaapi -profile:v main10 -qp 22
      -c:a libopus -b:a 128k
      "{{.dst_folder}}/{{.name}}-new.mp4"
      && exiftool -overwrite_original
      -tagsfromfile "{{.src_folder}}/{{.name}}.{{.extension}}"
      -all:all -m -Orient "{{.dst_folder}}/{{.name}}-new.mp4"
    extensions:
      - 3gp
      - 3gpp
      - avi
      - av1
      - flv
      - hevc
      - insv
      - m2t
      - m2ts
      - m4v
      - mkv
      - mod
      - mov
      - mpe
      - mpg
      - mp4
      - mts
      - tod
      - ts
      - webm
      - wmv

  # Every other image format Immich accepts (including camera RAW) is uploaded as it is.
  - name: passthrough-other-images
    command: ""
    extensions:
    - jfif
    - hif
    - insp
    - jp2
    - jpe
    - jxl
    - mpo
    - svg
    - 3fr
    - ari
    - arw
    - cap
    - cin
    - cr2
    - cr3
    - crw
    - dcr
    - dng
    - erf
    - fff
    - iiq
    - k25
    - kdc
    - mrw
    - nef
    - nrw
    - orf
    - ori
    - pef
    - psd
    - raf
    - raw
    - rw2
    - rwl
    - sr2
    - srf
    - srw
    - x3f

  # Every other video format Immich accepts is uploaded as it is.
  - name: passthrough-other-videos
    command: ""
    extensions:
    - mpeg
    - mxf
    - vob
